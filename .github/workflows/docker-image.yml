name: build docker image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-image-tar:
    name: build ${{ matrix.arch }} image tar
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set image version
        id: version
        run: echo "ver=$(TZ=Asia/Hong_Kong date '+%Y.%m.%d')" >> "$GITHUB_OUTPUT"

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: create output directory
        run: mkdir -p output

      - name: build ${{ matrix.arch }} image tar
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: chathygiene:latest
          outputs: type=docker,dest=output/chathygiene-${{ matrix.arch }}-${{ steps.version.outputs.ver }}.tar
          cache-from: type=gha,scope=chathygiene-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=chathygiene-${{ matrix.arch }}

      - name: upload image tar
        uses: actions/upload-artifact@v7
        with:
          name: chathygiene-${{ matrix.arch }}-${{ steps.version.outputs.ver }}
          path: output/chathygiene-${{ matrix.arch }}-${{ steps.version.outputs.ver }}.tar
          if-no-files-found: error

  publish-release:
    name: publish image tar release
    runs-on: ubuntu-latest
    needs: build-image-tar

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: prepare daily release tag
        id: release
        run: |
          release_date="$(TZ=Asia/Hong_Kong date +%Y.%m.%d)"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
          echo "tag_name=docker-$release_date" >> "$GITHUB_OUTPUT"
          echo "release_name=ChatHygiene Docker $release_date" >> "$GITHUB_OUTPUT"

      - name: move daily release tag
        run: |
          git tag -f "${{ steps.release.outputs.tag_name }}" "$GITHUB_SHA"
          git push --force origin "refs/tags/${{ steps.release.outputs.tag_name }}"

      - name: download image tar artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: chathygiene-*-${{ steps.release.outputs.release_date }}
          path: output
          merge-multiple: true

      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_NOTES: Download the Docker image tar files below.
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes "$RELEASE_NOTES"
            gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | while read -r asset_name; do
              gh release delete-asset "$TAG_NAME" "$asset_name" --yes
            done
            gh release upload "$TAG_NAME" output/*.tar --clobber
          else
            gh release create "$TAG_NAME" output/*.tar \
              --title "$RELEASE_NAME" \
              --notes "$RELEASE_NOTES"
          fi
